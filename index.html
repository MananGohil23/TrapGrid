<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrapGrid — a Supercell-themed floor game</title>
  <meta name="description" content="A two-player blindfold floor game. The Watcher sees the trap map; the Runner does not. Every grid is solvable and never repeats.">
  <meta name="theme-color" content="#0a100c">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23132017'/%3E%3Ccircle cx='30' cy='36' r='15' fill='%232a2b33' stroke='%23f7c948' stroke-width='3'/%3E%3Cpath d='M40 20c4 1 6 4 6 8' stroke='%23f7c948' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="logo-mark" viewBox="0 0 64 64">
        <path d="M32 4 56 12v20c0 14-10 24-24 28C18 56 8 46 8 32V12z" fill="#132017" stroke="#f7c948" stroke-width="3"/>
        <path d="M18 24h28M18 32h28M18 40h28M27 16v32M37 16v32" stroke="#3d6b35" stroke-width="1.4" opacity=".75"/>
        <circle cx="32" cy="33" r="11" fill="#25262e" stroke="#0d0e13" stroke-width="2"/>
        <circle cx="28" cy="29" r="3" fill="#4a4c57" opacity=".75"/>
        <path d="M39 22c2 0 4 1 5 3" stroke="#b9832c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M43 19l2 2M45 26l3-1" stroke="#f7c948" stroke-width="2" stroke-linecap="round"/>
      </symbol>

      <symbol id="trap-bomb" viewBox="0 0 48 48">
        <path d="M34 10c4 1 6 4 6 8" stroke="#b9832c" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M40 8l2.5 2.5M41 15l3-.8" stroke="#f7c948" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="23" cy="29" r="13" fill="#2a2b33" stroke="#101116" stroke-width="2"/>
        <circle cx="19" cy="24" r="4" fill="#4c4e59" opacity=".7"/>
        <rect x="27" y="13" width="7" height="6" rx="2" fill="#3a3b45" stroke="#101116" stroke-width="1.5"/>
      </symbol>

      <symbol id="trap-spring" viewBox="0 0 48 48">
        <rect x="8" y="36" width="32" height="5" rx="2.5" fill="#6b4a2b" stroke="#3f2a17" stroke-width="1.5"/>
        <path d="M12 31c1-6 6-6 7 0s6 6 7 0 6-6 7 0" fill="none" stroke="#f7c948" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M13 20c2-3 5-3 6 0" fill="none" stroke="#b9832c" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="36" cy="33" r="2.2" fill="#f7c948"/>
      </symbol>

      <symbol id="trap-giant" viewBox="0 0 48 48">
        <path d="M33 12c4 1 6 4 6 8" stroke="#b9832c" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M40 9l2.5 2.5M41 17l3-.8" stroke="#f7c948" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="23" cy="29" r="15" fill="#22232b" stroke="#0e0f14" stroke-width="2.5"/>
        <path d="M9 28h28" stroke="#f7c948" stroke-width="3" opacity=".9"/>
        <circle cx="18" cy="23" r="2" fill="#f7c948"/>
        <circle cx="28" cy="23" r="2" fill="#f7c948"/>
        <path d="M19 35h8" stroke="#f7c948" stroke-width="2.2" stroke-linecap="round"/>
      </symbol>

      <symbol id="trap-air" viewBox="0 0 48 48">
        <path d="M32 10c3 1 5 3 6 6" stroke="#b9832c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M37 8l2 2M38 14l3-.7" stroke="#f7c948" stroke-width="2" stroke-linecap="round"/>
        <circle cx="24" cy="28" r="11" fill="#b83a2c" stroke="#5e1b14" stroke-width="2"/>
        <path d="M13 25 5 20v14l8-5M35 25l8-5v14l-8-5" fill="#2a2b33" stroke="#101116" stroke-width="1.5"/>
        <circle cx="20" cy="24" r="3.5" fill="#e86a55" opacity=".8"/>
        <rect x="21" y="14" width="6" height="4" rx="1" fill="#3a3b45"/>
      </symbol>

      <symbol id="trap-mine" viewBox="0 0 48 48">
        <g stroke="#14151c" stroke-width="3" stroke-linecap="round">
          <path d="M24 9v7M24 32v7M9 24h7M32 24h7M13 13l5 5M30 30l5 5M35 13l-5 5M18 30l-5 5"/>
        </g>
        <circle cx="24" cy="24" r="10" fill="#33343d" stroke="#11121a" stroke-width="2"/>
        <circle cx="24" cy="24" r="4" fill="#e0432f"/>
        <circle cx="21" cy="20" r="2" fill="#6e7080" opacity=".7"/>
      </symbol>

      <symbol id="trap-skeleton" viewBox="0 0 48 48">
        <rect x="11" y="14" width="26" height="26" rx="5" fill="#7a4a22" stroke="#40240f" stroke-width="2"/>
        <path d="M11 22h26M11 32h26" stroke="#4a2a12" stroke-width="2"/>
        <circle cx="24" cy="28" r="7" fill="#f2ead8"/>
        <circle cx="21" cy="27" r="2" fill="#3a2a1a"/>
        <circle cx="27" cy="27" r="2" fill="#3a2a1a"/>
        <path d="M22 32h4" stroke="#3a2a1a" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>

      <symbol id="trap-tornado" viewBox="0 0 48 48">
        <path d="M37 9c-8-3-20-2-25 4s2 10 11 11 14 4 12 9-14 7-22 3" fill="none" stroke="#8fd3e8" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M16 40c6 2 12 1 15-2" fill="none" stroke="#5aa9c7" stroke-width="3" stroke-linecap="round"/>
        <path d="M25 17c3 0 6 1 6 3s-4 3-7 3" fill="none" stroke="#d8f5ff" stroke-width="2" stroke-linecap="round" opacity=".8"/>
      </symbol>

      <symbol id="icon-runner" viewBox="0 0 48 48">
        <circle cx="24" cy="26" r="13" fill="#e8b17a" stroke="#7a4a22" stroke-width="2"/>
        <path d="M11 22c0-8 6-14 13-14s13 6 13 14v3H11z" fill="#f3c24e" stroke="#8c5a12" stroke-width="2"/>
        <path d="M11 22c-4-1-6-5-4-8 3 0 5 2 6 5M37 22c4-1 6-5 4-8-3 0-5 2-6 5" fill="#f3c24e" stroke="#8c5a12" stroke-width="2"/>
        <rect x="13" y="23" width="22" height="7" rx="3.5" fill="#26313a" stroke="#111820" stroke-width="1.5"/>
        <path d="M19 34c2 1.5 8 1.5 10 0" stroke="#7a4a22" stroke-width="2" fill="none" stroke-linecap="round"/>
      </symbol>

      <symbol id="icon-flag" viewBox="0 0 48 48">
        <path d="M14 43V7" stroke="#6b4a2b" stroke-width="4" stroke-linecap="round"/>
        <path d="M16 9h24l-6 9 6 9H16z" fill="#f7c948" stroke="#8c5a12" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="15" cy="6" r="3" fill="#ffe58a" stroke="#8c5a12" stroke-width="1.5"/>
      </symbol>

      <symbol id="icon-start" viewBox="0 0 48 48">
        <path d="M12 40V14c0-3 2-5 5-5h20v31" fill="none" stroke="#8fe3c8" stroke-width="3" stroke-linecap="round"/>
        <path d="M22 32l8-8-8-8M30 24H14" fill="none" stroke="#d8fff1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>

      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>

      <symbol id="icon-eye" viewBox="0 0 24 24">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>

      <symbol id="icon-fingerprint" viewBox="0 0 24 24">
        <path d="M12 11a4 4 0 0 0-4 4v2M12 11a4 4 0 0 1 4 4v3M8 8a7 7 0 0 1 11 5v4M5 12a9 9 0 0 1 2-4M19 12v5M12 16v3M9 21c1-1 2-2 2-4v-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>

      <symbol id="icon-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 3v18M15 3v18M3 9h18M3 15h18" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </symbol>

      <symbol id="icon-star" viewBox="0 0 24 24">
        <path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5L2.6 9.3l6.5-.9z" fill="currentColor"/>
      </symbol>

      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>

      <symbol id="icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M5 15V5a2 2 0 0 1 2-2h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>

      <symbol id="icon-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>

      <symbol id="icon-shield" viewBox="0 0 24 24">
        <path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M8 12l3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>

      <symbol id="icon-bolt" viewBox="0 0 24 24">
        <path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/>
      </symbol>
    </defs>
  </svg>

  <div class="hero-scrim" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="Supercell">
      <div class="brand-text">
        <span class="brand-name">TrapGrid</span>
      </div>
    </div>
    <div class="top-actions">
      <span class="top-round" id="topRound">10 × 4 · Round 0001</span>
    </div>
  </header>

  <main class="shell">
    <noscript>
      <p class="noscript-note">TrapGrid needs JavaScript to forge and track grids. Enable JavaScript and reload the page.</p>
    </noscript>

    <section class="view game-view" id="gameView">
      <div class="map-head">
        <div class="status" id="statusText" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
        </div>
        <div class="hud" aria-label="Round statistics">
          <div class="hud-box"><span class="hud-value" id="timer">00:00</span><span class="hud-label">Time</span></div>
          <div class="hud-box"><span class="hud-value" id="moveCount">0</span><span class="hud-label">Moves</span></div>
          <div class="hud-box hud-box-hits"><span class="hud-value" id="hitCount">0</span><span class="hud-label">Trap hits</span></div>
        </div>
        <div class="map-actions">
          <button class="btn btn-small btn-ghost" id="resetBtn" type="button">Reset route</button>
          <button class="btn btn-small btn-primary" id="newGridBtn" type="button">New grid</button>
        </div>
      </div>

      <div class="arena-stage">
        <div class="figure-rail figure-rail-left" aria-hidden="true">
          <div class="figure figure-bowler"><img src="assets/figures/bowler.svg" alt=""></div>
          <div class="figure figure-archer"><img src="assets/figures/archer.svg" alt=""></div>
        </div>

        <div class="board-scroll">
          <div class="board" id="board" tabindex="0" aria-label="10 by 4 trap map. Use the arrow keys or click a neighbouring tile to trace the Runner."></div>
        </div>

        <div class="figure-rail figure-rail-right" aria-hidden="true">
          <div class="figure figure-hogrider"><img src="assets/figures/hogrider.svg" alt=""></div>
          <div class="figure figure-prince"><img src="assets/figures/prince.svg" alt=""></div>
          <div class="figure figure-knight"><img src="assets/figures/knight.svg" alt=""></div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal" id="winModal" hidden>
    <div class="modal-backdrop" data-close="winModal"></div>
    <div class="modal-card modal-card-win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <button class="modal-x" type="button" data-close="winModal" aria-label="Close">
        <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
      <p class="panel-kicker">Mission complete</p>
      <h2 id="winTitle">Grid cleared!</h2>
      <div class="stars" id="winStars" aria-hidden="true"></div>
      <p class="win-sub" id="winSub">The Runner made it through without a scratch.</p>
      <div class="win-stats" id="winStats"></div>
      <p class="win-id" id="winId"></p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="winNextBtn" type="button">Forge next grid</button>
        <button class="btn btn-ghost" type="button" data-close="winModal">Inspect map</button>
      </div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
